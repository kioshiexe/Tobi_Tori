<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <title>Tobi Tori | Kitchen Inventory</title>
    <link rel="icon" type="image/png" href="/assets/tobi_tori_icon.jpg">
</head>
<body>
    <div class="login-container">
        <div class="avatar">
            <img src="/assets/tobi_tori_logo.jpg" alt="Tobi Tori Logo">
        </div>
        <h1>Log In</h1>

        <p id="login-error" class="login-error" role="alert" hidden></p>
        <form action="/php/login.php" method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <a href="/html/password_reset.html" class="forgot-password">Forgot Password?</a>

            <button type="submit">Login</button>
        </form>
    </div>
    <script src="/js/login.js" defer></script>
</body>
</html>
